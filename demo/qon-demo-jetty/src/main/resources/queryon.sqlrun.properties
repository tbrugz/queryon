@includes=${propfilebasedir}/queryon.db.properties

sqlrun.connpropprefix=queryon

###

sqlrun.exec.05.statement=create schema if not exists queryon

sqlrun.exec.10.statement=create table if not exists queryon.qon_queries ( \n\
	schema_name varchar(100), \n\
	name varchar(100) not null, \n\
	remarks varchar(400), \n\
	query clob, -- text? \n\
	roles_filter varchar(1000), \n\
	disabled tinyint, \n\
	created_at timestamp, \n\
	created_by varchar(200), \n\
	updated_at timestamp, \n\
	updated_by varchar(200), \n\
	constraint qon_queries_pk primary key (name) \n\
)

sqlrun.exec.20.statement=drop table if exists queryon.countries_gdp

sqlrun.exec.25.statement=create table if not exists queryon.countries_gdp ( \n\
	entity varchar(200), \n\
	code varchar(10), \n\
	year_num integer, \n\
	gdp_per_capita number(10,3), \n\
	constraint countries_gdp_pk primary key (code) \n\
)

sqlrun.exec.30.import=csv
sqlrun.exec.30.inserttable=countries_gdp
sqlrun.exec.30.importfile=target/data/gdp-per-capita-maddison-project-database.csv
sqlrun.exec.30.skipnlines=1
